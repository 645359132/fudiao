# M0 实验配置：DeepSeek（OpenAI 写法，服务种类 openai_compatible），考虑成本代替默认的 Claude 配置。
# API Key 只从环境变量 DEEPSEEK_API_KEY 读取，不写入本文件。运行：
#   pnpm m0 run m0/scenes/warehouse.yaml --experiment m0/experiments/deepseek.yaml
#
# 模型与价格按 DeepSeek 文档（https://api-docs.deepseek.com/quick_start/pricing，2026-10-08 查阅）：
#   deepseek-flash    上下文 1M，最大输出 384K，支持 JSON 输出，默认开启思考
# 价格（美元 / 百万 Token）分高峰（周一至周五 UTC 01:00–04:00、06:00–10:00）与非高峰（高峰价的一半）。
# 下面按高峰价填写，费用估算与预算上限宁高勿低。
# DeepSeek 默认开启思考，思考也计入输出（首轮实验中 8000 的上限截断了认知更新与证据判断）。
# 作者决定不限制输出：各任务的输出上限都取模型允许的最大值。
# 降本（2026-10-14）：首轮实验的费用约七成是思考计入的输出。抽取与判断类任务（认知更新、证据判断、僵局、导演）
# 用 low；人物行动、语义裁决与正文保持默认的 high，它们决定推演与文字的质量。非高峰时段（周末，以及工作日
# UTC 01:00–04:00、06:00–10:00 以外）价格减半，批量实验尽量放在非高峰时段。

providers:
  deepseek:
    kind: openai_compatible
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com

models:
  flash:
    provider: deepseek
    model: deepseek-flash
    capabilities:
      structuredOutput: json_object
      promptCaching: false
      # DeepSeek 支持 reasoning_effort（low、high、max；medium 按 high），2026-10-14 核实。
      reasoningControl: effort
      refusalFallback: none
      contextWindow: 1000000
      maxOutputTokens: 384000
      selfTestPassed: false
    prices: { input: 0.3, output: 1.2, cacheRead: 0.006 }

# 全部任务使用 flash（作者决定：官方文档中 pro 没有优势）；推演组与对照组用同一个模型，比较才公平。
tasks:
  character_action: { model: flash, effort: high, maxOutputTokens: 384000 }
  semantic_ruling: { model: flash, effort: high, maxOutputTokens: 384000 }
  belief_update: { model: flash, effort: low, maxOutputTokens: 384000 }
  judgement: { model: flash, effort: low, maxOutputTokens: 384000 }
  beat_sheet: { model: flash, maxOutputTokens: 384000 }
  candidate_text: { model: flash, maxOutputTokens: 384000 }
  baseline: { model: flash, maxOutputTokens: 384000 }
  stalemate: { model: flash, effort: low, maxOutputTokens: 384000 }
  director: { model: flash, effort: low, maxOutputTokens: 384000 }

run:
  mode: auto
  runs: 1
  maxProposalAttempts: 2
  maxRepairs: 2
  stalemate: { enabled: true, window: 3 }
  director:
    mode: off
    tensionCurve: ''
    maxProposals: 3

budget:
  # 作者决定不设费用上限；字段必填，填一个不会碰到的值。运行前仍会显示预计费用并请作者确认。
  limitUsdPerRun: 1000
