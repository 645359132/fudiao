[package]
name = "novel-writer"
version = "0.1.0"
description = "中文长篇小说编辑器"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
# 库名与可执行文件名分开，避免 Windows 上 cargo 的同名产物冲突。
name = "novel_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
