[package]
name = "fudiao"
version = "0.1.0"
description = "复调：中文长篇小说编辑器"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
publish = false

[lib]
# 库名与可执行文件名分开，避免 Windows 上 cargo 的同名产物冲突。
name = "fudiao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 自带 SQLite（含 FTS5，供 M1-11 的 trigram 全文查找），不依赖系统库。
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
# 只用于选择作品文件夹。
tauri-plugin-dialog = "2.8"
# 导入 TXT 时识别与转换编码（GB18030、Big5、UTF-16 等）。
encoding_rs = "0.8"
chardetng = "1"
# 作品包（zip）：只启用 deflate，不带其他压缩格式与加密。
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 凭据代理（M2-01）：转发模型服务的请求。TLS 用系统的 schannel（native-tls），使用系统证书库，
# 不需要 rustls 默认的 aws-lc-rs 构建工具；system-proxy 让请求走系统代理设置。
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2", "system-proxy"] }
tokio = { version = "1", features = ["sync", "macros", "time"] }
futures-util = { version = "0.3", default-features = false }
url = "2"
# 凭据存储（M2-02）：Windows 凭据管理器。
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
# 凭据代理的测试：本机起一个最小的 HTTP 服务。
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
