[package]
name = "fudiao"
version = "0.1.0"
description = "复调：中文长篇小说编辑器"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
# 库名与可执行文件名分开，避免 Windows 上 cargo 的同名产物冲突。
name = "fudiao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 自带 SQLite（含 FTS5，供 M1-11 的 trigram 全文查找），不依赖系统库。
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
# 只用于选择作品文件夹。
tauri-plugin-dialog = "2.8"
# 导入 TXT 时识别与转换编码（GB18030、Big5、UTF-16 等）。
encoding_rs = "0.8"
chardetng = "1"
# 作品包（zip）：只启用 deflate，不带其他压缩格式与加密。
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
