name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 检查（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        # 产品目标平台是 Windows；Linux 用于尽早发现路径与换行符问题。
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: 代码检查
        run: pnpm lint
      - name: 依赖边界检查
        run: pnpm depcheck
      - name: 测试
        # 持续集成不访问任何真实模型服务（硬性规则 14）。
        run: pnpm test

  desktop:
    name: 桌面应用（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: 构建界面
        # generate_context! 在编译期读取前端产物，cargo test 之前先构建。
        run: pnpm --filter @fudiao/desktop build
      - name: Rust 格式与静态检查
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust 测试
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: 生成安装包
        run: pnpm --filter @fudiao/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
